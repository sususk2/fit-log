name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    # 빌드 검사용 임시 값 (실제 Firebase 값은 저장소에 넣지 않는다)
    env:
      VITE_FIREBASE_API_KEY: ci-build-check
      VITE_FIREBASE_AUTH_DOMAIN: ci-build-check.firebaseapp.com
      VITE_FIREBASE_PROJECT_ID: ci-build-check
      VITE_FIREBASE_APP_ID: ci-build-check
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install
        run: npm install
      - name: Unit test
        run: npm test
      - name: Build
        run: npm run build

  rules-test:
    # Firestore 에뮬레이터에서 Security Rules 자동 테스트 (실제 프로젝트에는 접속하지 않음: demo- 프로젝트)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install
        run: |
          npm install
          npm install --no-save --legacy-peer-deps @firebase/rules-unit-testing firebase-tools
      - name: Rules test (emulator)
        run: npx firebase emulators:exec --only firestore --project demo-fitlog "npm run test:rules"
