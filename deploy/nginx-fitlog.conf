# JCloud(Ubuntu) Nginx 설정 — 7주차 실습의 nginx 설정을 바탕으로 경로만 변경
server {
    listen 80 default_server;
    server_name _;
    root /var/www/fit-log;
    index index.html;
    location /assets/ { try_files $uri =404; }
    location / {
        # /workouts 같은 화면 경로를 새로고침해도 index.html을 돌려준다
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
